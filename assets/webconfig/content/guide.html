<div class="container-fluid fork-guide">
  <h3 class="page-header"><i class="fa fa-book fa-fw"></i><span data-i18n="main_menu_guide_token">Anleitung</span></h3>
  <!-- zwei Felder: links die Anleitung, rechts der Ablauf vom TV-Bild zu den LEDs (js/flowchart.js,
       wie auf der Testseite); schmale Fenster zeigen beide untereinander -->
  <div class="row">
    <div class="col-lg-6">
      <div class="panel panel-default">
        <div class="panel-heading"><i class="fa fa-list-ol fa-fw"></i><span data-i18n="guide_panel_setup">First setup</span></div>
        <div class="panel-body" id="guide_cont"></div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="panel panel-default">
        <div class="panel-heading"><i class="fa fa-sitemap fa-fw"></i><span data-i18n="guide_panel_flow">From the TV picture to the LEDs</span></div>
        <div class="panel-body" id="guide_flow"></div>
      </div>
    </div>
  </div>
</div>

<script type="text/javascript">
  // Fork-Erweiterung: die Anleitung der TV-Testseite (Ersteinrichtung), angepasst für die WebUI. Jeder
  // Schritt verlinkt die Karte der Testseite (/#card-…, die Testseite öffnet und zeigt sie) und,
  // wo es passt, die Seite hier in der WebUI (Klick auf den Menüpunkt, damit das Menü mitgeht). „flow“
  // sind die Verarbeitungsschritte im Feld rechts, in denen der Schritt wirkt.
  performTranslation();

  (function () {
    const base = testPageBase();
    const sections = [
      { title: 'guide_sec_webui', list: 'ul', steps: [
        { key: 'guide_s_leds', webui: ['MenuItemInstLeds'], flow: ['10', '22'] },
        { key: 'guide_s_grabber', webui: ['MenuItemGrabber'], flow: ['3', '5a'] },
      ] },
      { title: 'guide_sec_prep', steps: [
        { key: 'guide_s_ts', card: 'card-ts' },
        { key: 'guide_s_backup', card: 'card-backup', webui: ['MenuItemGeneral'] },
      ] },
      { title: 'guide_sec_color', steps: [
        { key: 'guide_s_rgb', card: 'card-rgb', webui: ['MenuItemInstLeds'], flow: ['20'] },
        { key: 'guide_s_gx', card: 'card-gx', webui: ['MenuItemGrabber'], flow: ['4', '7'] },
        { key: 'guide_s_color', card: 'card-color', webui: ['MenuItemInstConfColors'], flow: ['14', '16a', '17'] },
        { key: 'guide_s_ft', card: 'card-ft', webui: ['MenuItemInstConfColors'], flow: ['11', '22'] },
        { key: 'guide_s_gc', card: 'card-gcg', webui: ['MenuItemInstConfColors'], flow: ['15', '16a', '18'] },
      ] },
      { title: 'guide_sec_leds', steps: [
        { key: 'guide_s_lp', card: 'card-lp', webui: ['MenuItemInstLeds'], flow: ['10'] },
        { key: 'guide_s_dt', card: 'card-dt', webui: ['MenuItemInstLeds'], flow: ['10'] },
        { key: 'guide_s_bars', card: 'card-bars', webui: ['MenuItemInstConfColors'], flow: ['9'] },
      ] },
      { title: 'guide_sec_special', steps: [
        { key: 'guide_s_ns', card: 'card-ns', webui: ['MenuItemGrabber'], flow: ['6'] },
        { key: 'guide_s_gs', card: 'card-gs', webui: ['MenuItemInstConfColors'], flow: ['12'] },
      ] },
      { title: 'guide_sec_finish', steps: [
        { key: 'guide_s_media', card: 'card-media' },
        { key: 'guide_s_smooth', card: 'card-sm', webui: ['MenuItemInstConfColors'], flow: ['21'] },
        { key: 'guide_s_backup2', card: 'card-backup' },
      ] },
    ];
    const link = (href, text) => '<a href="' + href + '" target="_blank" rel="noopener">' + text + '</a>';
    const menuName = (id) => $('#' + id + ' > span').first().text().trim();
    const flowRef = (steps) => {
      const nums = steps.map((n) => '<a href="#" data-guide-flow="' + n + '">' + n + '</a>');
      const list = nums.length === 1 ? nums[0] : nums.slice(0, -1).join(', ') + ' ' + $.i18n('guide_flow_and') + ' ' + nums.at(-1);
      return '<div class="guide-flowref"><i class="fa fa-sitemap fa-fw"></i>' + $.i18n(nums.length === 1 ? 'guide_flow_one' : 'guide_flow_many', list) + '</div>';
    };

    let html = '<p>' + $.i18n('guide_intro', link(base + '/tv', base + '/tv'), link(base + '/', base + '/')) + '</p>'
      + '<p>' + $.i18n('guide_foundation') + '</p>'
      + '<p>' + $.i18n('guide_vs_flow') + '</p>';
    let number = 1;
    for (const sec of sections) {
      const tag = sec.list || 'ol';
      html += '<h4>' + $.i18n(sec.title) + '</h4><' + tag + (tag === 'ol' ? ' start="' + number + '"' : '') + '>';
      for (const step of sec.steps) {
        const links = [];
        if (step.card) links.push('<a href="' + base + '/#' + step.card + '" target="_blank" rel="noopener"><i class="fa fa-external-link fa-fw"></i>' + $.i18n('guide_open_testpage') + '</a>');
        for (const id of step.webui || []) links.push('<a href="#" data-guide-goto="' + id + '"><i class="fa fa-arrow-right fa-fw"></i>' + $.i18n('guide_in_webui', menuName(id)) + '</a>');
        html += '<li>' + $.i18n(step.key) + (step.flow ? flowRef(step.flow) : '')
          + (links.length ? '<div class="guide-links">' + links.join('') + '</div>' : '') + '</li>';
        if (tag === 'ol') number++;
      }
      html += '</' + tag + '>';
    }
    html += '<h4>' + $.i18n('guide_sec_later') + '</h4><p>' + $.i18n('guide_later') + '</p>';
    $('#guide_cont').html(html);
    // Ortskästchen im Diagramm öffnen die Einstellungsseite, wie die Links in der Anleitung
    const pageMenu = { grabber: 'MenuItemGrabber', colors: 'MenuItemInstConfColors', leds: 'MenuItemInstLeds', remote: 'MenuItemRemoteControl' };
    ForkFlow.render(document.getElementById('guide_flow'), {
      lang: storedLang === 'de' ? 'de' : 'en', title: false,
      onGo: (page) => document.getElementById(pageMenu[page])?.click(),
    });

    // WebUI-Links: wie ein Klick im Menü (lädt die Seite und markiert den Menüpunkt)
    $('#guide_cont').on('click', '[data-guide-goto]', function (ev) {
      ev.preventDefault();
      document.getElementById(this.dataset.guideGoto)?.click();
    });
    // Verarbeitungsschritt: im Feld rechts hinscrollen und kurz markieren
    $('#guide_cont').on('click', '[data-guide-flow]', function (ev) {
      ev.preventDefault();
      ForkFlow.show(this.dataset.guideFlow);
    });
  })();

  removeOverlay();
</script>
