<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperion TV-Testseite</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
  #screen { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: #000; }
  .bar { position: fixed; background: #000; }
  #bar-top    { top: 0;    left: 0; right: 0;  height: 0; }
  #bar-bottom { bottom: 0; left: 0; right: 0;  height: 0; }
  #bar-left   { left: 0;   top: 0;  bottom: 0; width: 0; }
  #bar-right  { right: 0;  top: 0;  bottom: 0; width: 0; }

  /* capture depth test: a band (frame) or a running line (sweep) along all four edges */
  #depth { position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
  #depth .band { position: absolute; }
  #depth .band.t { top: 0; left: 0; right: 0; }
  #depth .band.b { bottom: 0; left: 0; right: 0; }
  #depth .band.l { left: 0; top: 0; bottom: 0; }
  #depth .band.r { right: 0; top: 0; bottom: 0; }
  #depth .sweep { position: absolute; box-sizing: border-box; border-style: solid; }

  /* fractional LED mean test: canvas in device pixels, so the dither is never smoothed by scaling */
  /* LED position test: markers in the sampling areas of the chosen LEDs */
  #pos { position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
  #pos .mark { position: absolute; }

  #frac { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; image-rendering: pixelated; }

  /* Connect hint: kept in the middle, so the screen edges (what the LEDs sample) stay free */
  #connect {
    /* left/right 0 + auto margins: centered without halving the available width like left: 50% would */
    position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%); margin: 0 auto;
    width: max-content; max-width: 86vw;
    display: flex; align-items: center; gap: 4vh; box-sizing: border-box;
    padding: 4vh; border-radius: 2vh; background: rgba(20, 20, 24, .94); color: #eee;
  }
  #connect[hidden] { display: none; }
  #qr { width: 42vh; height: 42vh; flex: none; background: #fff; border-radius: 1vh; }
  #qr svg { display: block; width: 100%; height: 100%; }
  #connect .logo { display: block; height: 6vh; width: auto; margin: 0 0 2.4vh; }
  #connect h1 { font-size: 4vh; margin: 0 0 2vh; color: #fff; }
  #connect p { font-size: 2.6vh; line-height: 1.45; margin: 0 0 1.6vh; max-width: 80vh; }
  #connect .url { font-size: 3vh; font-weight: 700; color: #fff; }
  #connect .small { font-size: 2.1vh; color: #999; margin: 0; }

  /* debug views (only when switched on for the TV on the phone) */
  #bb-overlay, #gs-area, #dp-area { position: fixed; top: 0; right: 0; bottom: 0; left: 0; pointer-events: none; }
  #bb-overlay svg, #gs-area svg, #dp-area svg { width: 100%; height: 100%; display: block; }
  .dbg-box {
    position: fixed; left: 50%; transform: translateX(-50%); box-sizing: border-box; max-width: 60vw;
    padding: 1.4vh 2vh; border-radius: 1.2vh; background: rgba(10, 10, 14, .85); color: #fff;
    font-size: 2.2vh; line-height: 1.4; pointer-events: none;
  }
  /* above 2/3 of the height, so the bottom-up center scan line stays visible */
  #bb-text { top: 29vh; }
  #gs-box { top: 36vh; width: 56vh; }
  /* grabber test: the measured color covers everything, also the connect hint */
  #gtest { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 100; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="screen"></div>
<div id="depth" hidden>
  <div class="band t"></div><div class="band b"></div><div class="band l"></div><div class="band r"></div>
  <div class="sweep"></div>
</div>
<canvas id="frac" hidden></canvas>
<div id="pos" hidden></div>
<div class="bar" id="bar-top"></div>
<div class="bar" id="bar-bottom"></div>
<div class="bar" id="bar-left"></div>
<div class="bar" id="bar-right"></div>

<div id="gs-area" hidden></div>
<div id="dp-area" hidden></div>
<div id="bb-overlay" hidden></div>
<div class="dbg-box" id="bb-text" hidden></div>
<div class="dbg-box" id="gs-box" hidden></div>

<div id="gtest" hidden></div>

<div id="connect">
  <div id="qr" role="img" aria-label="QR-Code zur Steuerung"></div>
  <div>
    <img class="logo" src="/static/hyperion-logo.png" alt="Hyperion">
    <h1>Mit dem Smartphone steuern</h1>
    <p>Der Test wird über dein Telefon gesteuert. Scanne den QR‑Code mit der Kamera oder öffne diese Adresse im Browser:</p>
    <p class="url" id="url"></p>
    <p>Sobald das Telefon verbunden ist, verschwindet dieser Hinweis und das Testbild ist frei.</p>
    <p class="small">OK auf der Fernbedienung blendet den Hinweis ein und aus.</p>
  </div>
</div>

<script type="module">
import { blackborderSvg, blackborderText, grayStillHtml, grayStillAreaSvg, depthAreaSvg, applyLedAreaDepth, posTestIndices, GRAY_STILL_CSS } from "/static/overlay.js";

const style = document.createElement("style");
style.textContent = GRAY_STILL_CSS;
document.head.appendChild(style);

const $ = (id) => document.getElementById(id);
const screenEl = $("screen");
const barEls = { top: $("bar-top"), bottom: $("bar-bottom"), left: $("bar-left"), right: $("bar-right") };
const connectEl = $("connect");

let state = { color: "#000000", colorActive: true, bars: { top: 0, bottom: 0, left: 0, right: 0 } };
let phones = 0;
let manualToggle = null; // null = automatic, true/false = forced by the remote
let clockOffset = 0;      // Pi clock minus TV clock
let grayTimer = null;
let debug = null;
let ledAreas = null;      // LED sampling areas from Hyperion's layout
let areaDepth = null;     // color.ledAreaDepth from Hyperion ({ topBottom, leftRight }, 0 = layout)
let sweepFrame = null;
let fracFrame = null;
let posFrame = null;
let posDrawn = "";
let fracDrawn = null;     // [level in 1/64 steps, tint, canvas size] of the picture on the canvas

$("url").textContent = location.host + "/";

function renderBars() {
  barEls.top.style.height = state.bars.top + "%";
  barEls.bottom.style.height = state.bars.bottom + "%";
  barEls.left.style.width = state.bars.left + "%";
  barEls.right.style.width = state.bars.right + "%";
}

// Gray test: show the tone, and dim it after dropAfter seconds like a paused player fading out
function renderGrayTest() {
  clearTimeout(grayTimer);
  const g = state.grayTest;
  if (!g?.active) {
    screenEl.style.transition = "";
    screenEl.style.background = state.colorActive === false ? "#000000" : state.color;
    return;
  }
  const gray = (v) => `rgb(${v}, ${v}, ${v})`;
  const dimmed = Math.round(g.tone * (1 - g.dropPercent / 100));
  const dropAt = g.startedAt + g.dropAfter * 1000 - clockOffset; // in TV clock
  const wait = dropAt - Date.now();
  if (!g.dropEnabled || wait > 0) {
    screenEl.style.transition = "";
    screenEl.style.background = gray(g.tone);
    if (g.dropEnabled) grayTimer = setTimeout(() => {
      screenEl.style.transition = `background-color ${g.dropDuration ?? 0.4}s linear`;
      screenEl.style.background = gray(dimmed);
    }, wait);
  } else {
    screenEl.style.transition = "";
    screenEl.style.background = gray(dimmed);
  }
}

// Capture depth test. frame: the edges in the outer color, topBottom % of the height and leftRight %
// of the width deep. sweep: a line of the outer color runs from the edges inwards to sweepMax % in
// sweepSeconds (timed against the Pi's clock like the gray test), then starts at the edge again.
function renderDepthTest() {
  cancelAnimationFrame(sweepFrame);
  const d = state.depthTest;
  const el = $("depth");
  el.hidden = !d?.active || state.grayTest?.active;
  if (el.hidden) return;
  el.style.background = d.inner;
  const frame = d.pattern !== "sweep";
  const [t, b, l, r] = el.querySelectorAll(".band");
  for (const band of [t, b, l, r]) { band.hidden = !frame; band.style.background = d.outer; }
  t.style.height = b.style.height = d.topBottom + "%";
  l.style.width = r.style.width = d.leftRight + "%";
  const sweep = el.querySelector(".sweep");
  sweep.hidden = frame;
  if (frame) return;
  // the line is lineWidth % of the screen height thick on all four sides
  sweep.style.borderColor = d.outer;
  sweep.style.borderWidth = d.lineWidth + "vh";
  const step = () => {
    const elapsed = (Date.now() + clockOffset - d.startedAt) / 1000;
    const p = ((elapsed % d.sweepSeconds) + d.sweepSeconds) % d.sweepSeconds / d.sweepSeconds;
    const pos = p * d.sweepMax; // percent of height (top/bottom) and of width (sides)
    sweep.style.top = sweep.style.bottom = pos + "%";
    sweep.style.left = sweep.style.right = pos + "%";
    sweepFrame = requestAnimationFrame(step);
  };
  step();
}

// Fractional LED mean test. A level like 25.375 is drawn as an ordered dither (8x8 Bayer matrix) of
// 25 and 26 with 24 of 64 pixels at 26, so every LED area averages to the level with its fractions.
// ramp: from -> to and back, rampSeconds per way; toggle: base and base + delta, toggleSeconds each.
const BAYER8 = (() => {
  const m = [[0]];
  let n = 1;
  let out = m;
  while (n < 8) {
    out = Array.from({ length: n * 2 }, (_, y) => Array.from({ length: n * 2 }, (_, x) => 4 * out[y % n][x % n] + [0, 2, 3, 1][(y >= n) * 2 + (x >= n)]));
    n *= 2;
  }
  return out;
})();
const TINTS = { gray: [1, 1, 1], red: [1, 0, 0], green: [0, 1, 0], blue: [0, 0, 1] };

function fracLevel(f, now) {
  const elapsed = Math.max(0, (now + clockOffset - f.startedAt) / 1000);
  if (f.pattern === "toggle") return Math.floor(elapsed / f.toggleSeconds) % 2 ? f.base + f.delta : f.base;
  const p = (elapsed % (2 * f.rampSeconds)) / f.rampSeconds; // 0..2
  return f.from + (f.to - f.from) * (p <= 1 ? p : 2 - p);
}

function drawFrac(canvas, level, tint) {
  const steps = Math.round(Math.min(255, Math.max(0, level)) * 64);
  const key = [steps, tint, canvas.width, canvas.height].join();
  if (fracDrawn === key) return;
  fracDrawn = key;
  const base = Math.floor(steps / 64);
  const high = steps - base * 64; // pixels per 64 at base + 1
  const t = TINTS[tint] ?? TINTS.gray;
  const tile = document.createElement("canvas");
  tile.width = tile.height = 8;
  const tctx = tile.getContext("2d");
  const img = tctx.createImageData(8, 8);
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const v = Math.min(255, base + (BAYER8[y][x] < high ? 1 : 0));
    const i = (y * 8 + x) * 4;
    img.data[i] = v * t[0]; img.data[i + 1] = v * t[1]; img.data[i + 2] = v * t[2]; img.data[i + 3] = 255;
  }
  tctx.putImageData(img, 0, 0);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = ctx.createPattern(tile, "repeat");
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function renderFracTest() {
  cancelAnimationFrame(fracFrame);
  const f = state.fracTest;
  const canvas = $("frac");
  canvas.hidden = !f?.active || state.grayTest?.active || state.depthTest?.active;
  if (canvas.hidden) return;
  const dpr = window.devicePixelRatio || 1;
  const w = Math.round(window.innerWidth * dpr), h = Math.round(window.innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const step = () => {
    drawFrac(canvas, fracLevel(f, Date.now()), f.tint);
    fracFrame = requestAnimationFrame(step);
  };
  step();
}
window.addEventListener("resize", () => { fracDrawn = null; if (state.fracTest?.active) renderFracTest(); });

// LED position test: the marker covers exactly the sampling area of the chosen LEDs (layout with
// Hyperion's capture depth), the grabber sees it there and lights exactly those LEDs
const POS_BACKGROUND = { black: "#000000", gray: "rgb(20, 20, 20)" };
function renderPosTest() {
  cancelAnimationFrame(posFrame);
  const p = state.posTest;
  const el = $("pos");
  el.hidden = !p?.active || state.grayTest?.active || state.depthTest?.active || state.fracTest?.active;
  if (el.hidden) { posDrawn = ""; return; }
  el.style.background = POS_BACKGROUND[p.background] ?? "#000000";
  const areas = applyLedAreaDepth(ledAreas ?? [], areaDepth?.topBottom, areaDepth?.leftRight);
  const step = () => {
    const ids = posTestIndices(p, areas.length, Date.now() + clockOffset);
    const key = ids.join() + p.color + areas.length + JSON.stringify(areaDepth);
    if (key !== posDrawn) {
      posDrawn = key;
      el.innerHTML = ids.map((i) => {
        const [x1, x2, y1, y2] = areas[i];
        return `<div class="mark" style="left:${x1 * 100}%;top:${y1 * 100}%;width:${(x2 - x1) * 100}%;height:${(y2 - y1) * 100}%;background:${p.color}"></div>`;
      }).join("");
    }
    if (p.mode === "run") posFrame = requestAnimationFrame(step);
  };
  step();
}

function renderDebug() {
  const o = state.overlays ?? {};
  const bb = debug?.ok ? debug.blackborder : null;
  const gs = debug?.ok ? debug.grayStill : null;
  $("bb-overlay").hidden = !o.bbTv;
  $("bb-text").hidden = !o.bbTv;
  if (o.bbTv) {
    $("bb-overlay").innerHTML = blackborderSvg(bb);
    $("bb-text").textContent = debug?.ok ? blackborderText(bb) : "Keine Daten von Hyperion" + (debug?.error ? ` (${debug.error})` : "");
  }
  $("gs-box").hidden = !o.gsTv;
  if (o.gsTv) $("gs-box").innerHTML = grayStillHtml(gs);
  $("gs-area").hidden = !o.gsTv;
  if (o.gsTv) $("gs-area").innerHTML = grayStillAreaSvg(gs, ledAreas, bb, areaDepth);
  $("dp-area").hidden = !o.dpTv;
  if (o.dpTv) $("dp-area").innerHTML = depthAreaSvg(ledAreas, bb, areaDepth);
}

// grabber test (run by the server): full screen test color, nothing else may be in the picture
const grabberTestRunning = () => !!(state.grabberRun?.running && state.grabberRun.color);
function renderGrabberTest() {
  const el = $("gtest");
  el.hidden = !grabberTestRunning();
  if (!el.hidden) el.style.background = state.grabberRun.color;
}
const connectHidden = () => grabberTestRunning() || (manualToggle === null ? phones > 0 : !manualToggle);

function render() {
  renderGrabberTest();
  renderGrayTest();
  renderDepthTest();
  renderFracTest();
  renderPosTest();
  renderBars();
  // automatic: show the hint while no phone is connected
  connectEl.hidden = connectHidden();
  renderDebug();
}

async function loadQr() {
  try {
    $("qr").innerHTML = await (await fetch("/api/qr.svg")).text();
  } catch { /* the URL text next to the code still works */ }
}

// Some Android TV browsers report the D-pad center as keyCode 23 instead of Enter
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" || ev.keyCode === 13 || ev.keyCode === 23) {
    manualToggle = connectEl.hidden;
    render();
    ev.preventDefault();
  }
});

function connectEvents() {
  const es = new EventSource("/api/events?role=tv");
  es.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    // a phone joining or leaving resets a manual toggle back to automatic
    if (msg.phones !== phones) manualToggle = null;
    phones = msg.phones ?? 0;
    if (msg.serverNow) clockOffset = msg.serverNow - Date.now();
    const grayChanged = JSON.stringify(msg.grayTest) !== JSON.stringify(state.grayTest) || JSON.stringify(msg.depthTest) !== JSON.stringify(state.depthTest)
      || JSON.stringify(msg.fracTest) !== JSON.stringify(state.fracTest)
      || JSON.stringify(msg.posTest) !== JSON.stringify(state.posTest)
      || msg.color !== state.color || msg.colorActive !== state.colorActive;
    state = msg;
    if (grayChanged) render();
    else { renderBars(); renderDebug(); renderGrabberTest(); connectEl.hidden = connectHidden(); }
  };
  es.addEventListener("debug", (ev) => {
    debug = JSON.parse(ev.data);
    renderDebug();
  });
}

async function loadLedAreas() {
  try {
    const next = await (await fetch("/api/hyperion/leds")).json();
    if (JSON.stringify(next) === JSON.stringify(ledAreas)) return;
    ledAreas = next;
    renderDebug();
    renderPosTest();
  } catch { /* without the layout only the status box is shown */ }
}

// the capture depth changes from the phone; it is part of Hyperion's color settings, so it is read
// again whenever the depth overlay is on (cheap: one small DB read every few seconds)
async function loadAreaDepth() {
  try {
    const color = await (await fetch("/api/hyperion/color")).json();
    const next = color.ledAreaDepth ?? null;
    if (JSON.stringify(next) !== JSON.stringify(areaDepth)) { areaDepth = next; renderDebug(); renderPosTest(); }
  } catch { /* the layout areas are drawn then */ }
}
setInterval(() => { if (state.overlays?.dpTv || state.overlays?.gsTv || state.posTest?.active) loadAreaDepth(); }, 3000);
// the layout can change while the position test runs (e.g. a new LED count), so it is read again
setInterval(() => { if (state.posTest?.active) loadLedAreas(); }, 10000);

loadQr();
loadLedAreas();
loadAreaDepth();
render();
connectEvents();
</script>
</body>
</html>
